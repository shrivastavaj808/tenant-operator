apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.platform.example.com
spec:
  group: platform.example.com
  scope: Cluster
  names:
    kind: Tenant
    plural: tenants
    singular: tenant
    shortNames:
      - tn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Plan
          type: string
          jsonPath: .spec.plan
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')"
              message: "name may only contain lowercase letters, digits and '-' (it becomes part of a namespace name)"
            - rule: "self.metadata.name.size() <= 56"
              message: "name must be at most 56 characters (the namespace tenant-<name> has a 63 character limit)"
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self.plan == 'large' || self.replicas <= 2"
                  message: "the small plan allows at most 2 replicas"
              properties:
                displayName:
                  type: string
                  maxLength: 63
                plan:
                  type: string
                  enum:
                    - small
                    - large
                  default: small
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 4
                  default: 2
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true