apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenant-app
  annotations:
    cert-manager.io/cluster-issuer: tenants-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - TENANT.tenants.local
      secretName: tenant-app-tls
  rules:
    - host: TENANT.tenants.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tenant-app
                port:
                  name: http
