apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-globex
resources:
  - ../../base
  - sealedsecret.yaml
labels:
  - pairs:
      tenant: globex
    includeTemplates: true
configMapGenerator:
  - name: tenant-config
    literals:
      - TENANT_NAME=globex
patches:
  - target:
      kind: Ingress
      name: tenant-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: globex.tenants.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: globex.tenants.local
  - target:
      kind: RoleBinding
      name: tenant-developers
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: globex-developers

